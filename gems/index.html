<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14121f">
<title>Gemfall</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<script src="../shared/wavedash.js"></script>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/match3.css">
</head>
<body>
<main class="app">
  <header class="topbar">
    <a class="icon-btn" href="../" aria-label="All games">‹</a>
    <h1 id="title">Gemfall</h1>
    <button class="icon-btn" id="modeBtn" aria-label="Change mode">☰</button>
  </header>
  <section class="stats" aria-live="polite">
    <div class="stat" id="levelStat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
    <div class="stat" id="targetStat"><div class="label">Target</div><div class="value" id="target">0</div></div>
    <div class="stat"><div class="label" id="limitLabel">Moves</div><div class="value" id="limit">0</div></div>
  </section>
  <div class="progress" id="progressWrap"><div id="progress"></div></div>
  <section class="stage" id="stage"></section>
  <nav class="toolbar">
    <button class="btn" id="hintBtn">✦ Hint</button>
    <button class="btn" id="restartBtn">↻ Restart</button>
  </nav>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
